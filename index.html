<!doctype html>
<html lang="de"><head><meta charset="utf-8">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600;700&display=swap">
<style>
:root{--bg:#eef3f4;--card:#fff;--ink:#10242b;--mute:#5d737b;--line:#d3dee1;--acc:#0b5c7a;--accT:#fff;--stop:#c2372b}

body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 "Barlow Semi Condensed",system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:28px;margin:4px 0 12px}h2{font-size:20px;margin:28px 0 8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:12px}
label{display:flex;flex-direction:column;font-size:14px;color:var(--mute);gap:2px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;background:var(--acc);color:var(--accT);cursor:pointer;min-height:48px}
button.s{background:transparent;color:var(--ink);border:1px solid var(--line);min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.em{color:var(--mute)}.err{color:var(--stop)}.hide{display:none}
.r{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.nm{font-weight:700;font-size:20px}.tm{font-size:34px;font-weight:700}
.btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.btns button{flex:1;min-height:56px}
.big .btns button{min-height:88px;font-size:24px}.lp{font-size:15px;color:var(--mute);margin-top:6px}button.stop{background:var(--stop);color:#fff}
.w table{min-width:480px;white-space:nowrap}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}th{color:var(--mute)}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1}
form{display:flex;flex-direction:column;gap:10px}
</style></head><body><main id="app"><p class="em">Lädt …</p></main><p id="ver" class="em" style="text-align:center;font-size:13px"></p>

<script>
const sb=supabase.createClient('https://kosjjjtyacqrwskeguoj.supabase.co','sb_publishable_GOylUkcgi71ZWZ0Wl2ttLg_XpkXHb8N');
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=ms=>{ms=Math.floor(ms/100);return Math.floor(ms/600)+':'+String(Math.floor(ms/10)%60).padStart(2,'0')+','+ms%10};
let me=null,authMode='login';

function showAuth(msg=''){
 const reg=authMode==='register';
 app.innerHTML=`<h1>Rudern Training</h1>
 <div class="tabs"><button class="${reg?'s':''}" data-m="login">Anmelden</button><button class="${reg?'':'s'}" data-m="register">Registrieren</button></div>
 <form id="af" novalidate>${reg?'<label>Name<input id="nm" required autocomplete="name"></label><label>Club (Pflicht)<select id="cl" required><option value="">– wählen –</option>'+CLUBS.map(c=>`<option>${esc(c)}</option>`).join('')+'</select></label>'+(CLUBS.length?'':'<p class="err">Es sind noch keine Clubs angelegt. Bitte den ÖRV-Trainer kontaktieren.</p>'):''}
 <label>E-Mail<input id="em" type="email" required autocomplete="email"></label>
 <label>Passwort / Code (mind. 6 Zeichen)<input id="pw" type="password" minlength="6" required autocomplete="${reg?'new-password':'current-password'}"></label>
 <button>${reg?'Konto erstellen':'Anmelden'}</button></form><p class="err" id="msg">${esc(msg)}</p>`;
 app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{authMode=b.dataset.m;showAuth()});
 document.getElementById('af').onsubmit=async e=>{e.preventDefault();
  const email=document.getElementById('em').value.trim(),password=document.getElementById('pw').value,msgEl=document.getElementById('msg'),miss=[];
  if(reg){if(!document.getElementById('nm').value.trim())miss.push('Name');if(!document.getElementById('cl').value)miss.push('Club')}
  if(!email)miss.push('E-Mail');if(!password)miss.push('Passwort');
  if(miss.length)return msgEl.textContent='Bitte alle Felder ausfüllen. Es fehlt: '+miss.join(', ')+'.';
  if(!/^\S+@\S+\.\S+$/.test(email))return msgEl.textContent='Bitte eine gültige E-Mail-Adresse eingeben.';
  if(reg&&password.length<6)return msgEl.textContent='Das Passwort braucht mindestens 6 Zeichen.';
  const r=reg?await sb.auth.signUp({email,password,options:{data:{name:document.getElementById('nm').value.trim(),club:document.getElementById('cl').value}}}):await sb.auth.signInWithPassword({email,password});
  if(r.error)return showAuth(r.error.message);
  if(!r.data.session)return showAuth('Fast fertig: Bitte bestätige deine E-Mail über den Link, den wir dir geschickt haben, und melde dich dann an.');
  boot()};
}
async function boot(){await loadClubs();
 const {data:{user}}=await sb.auth.getUser();
 if(!user)return showAuth();
 const {data,error}=await sb.from('profiles').select('*').eq('id',user.id).single();
 if(error)return showAuth('Profil nicht gefunden: '+error.message);
 me=data;await loadClubs();if(!me.club&&['rower','club_trainer'].includes(me.role))return clubSetup();homeView();
}
const header=()=>{clearInterval(poll);try{wl&&wl.release()}catch(e){}return `<div class="head"><h1>${esc(me.name||'Hallo')} <span class="em" style="font-size:17px">${{admin:'Admin',trainer:'ÖRV-Trainer',club_trainer:'Club-Trainer',referee:'Schiedsrichter'}[me.role]||'Ruderer/in'}${me.club?' · '+esc(me.club):''}</span></h1><button class="s" id="out">Abmelden</button></div>`};
const bindOut=()=>document.getElementById('out').onclick=async()=>{await sb.auth.signOut();me=null;authMode='login';showAuth()};

async function rowerView(){
 app.innerHTML=header()+'<div class="bar" style="margin-top:8px"><button id="cb">Rechner</button><button class="s" id="nb2">Nominierung</button><button class="s" id="rb">Referenzzeiten</button><button class="s" id="gs2">Gesamtauswertung</button></div><h2>Meine Zeiten</h2><div class="box w" id="res"><p class="em">Lädt …</p></div><h2>Entwicklung</h2><div class="box" id="hist"><p class="em">Lädt …</p></div><h2>Einreichen</h2><div class="box" id="ph"></div><h2>Veröffentlichte Ergebnisse</h2><div class="box w" id="pub"></div>';bindOut();document.getElementById('cb').onclick=calcView;document.getElementById('nb2').onclick=nomView;document.getElementById('rb').onclick=wrView;document.getElementById('gs2').onclick=gesamtView;photoUI(document.getElementById('ph'));loadPub(document.getElementById('pub'));
 const [ev,mk,at]=await Promise.all([sb.from('events').select('*'),sb.from('marks').select('*').order('t'),sb.from('athletes').select('name,birth_year,gender,weight_class')]);
 const el=document.getElementById('res');
 if(ev.error||mk.error||at.error)return el.innerHTML=`<p class="err">${esc((ev.error||mk.error||at.error).message)}</p>`;
 if(!at.data.length)return el.innerHTML='<p class="em">Dein Konto ist noch keinem Namen zugeordnet. Dein Trainer ordnet dich zu, danach siehst du hier deine Zeiten.</p>';
 let rows='';
 ev.data.forEach(e=>{repsOf(mk.data.filter(m=>m.event_id===e.id)).forEach((p,i)=>{
  rows+=`<tr><td>${esc(e.title)}</td><td>${i+1}</td><td>${p.fin!=null?f(p.fin):'läuft'}</td><td>${p.fin!=null?sp(p.fin,e.distance_m):'–'}</td><td>${secsOf(p,e).map(x=>f(x.t)).join(' · ')}</td></tr>`})});
 const prof1=`<p class="em">${esc(at.data.map(x=>x.name+' · '+prof(x)).join(' / '))}</p>`;
 el.innerHTML=prof1+(rows?'<table><tr><th>Test</th><th>Intervall</th><th>Zeit</th><th>Split/500 m</th><th>Abschnitte</th></tr>'+rows+'</table>':'<p class="em">Noch keine Zeiten. Sobald dein Trainer dich stoppt, erscheinen sie hier.</p>');
 loadHist(document.getElementById('hist'));
}
async function trainerView(){
 app.innerHTML=header()+`<div class="bar" style="margin-top:8px"><button id="stb">Auswertung &amp; Vergleich</button><button class="s" id="cb">Rechner</button><button class="s" id="nb2">Nominierungs-Check</button><button class="s" id="lb2">Athletenliste</button><button class="s" id="rg2">Regatta-Verwaltung</button><button class="s" id="gs2">Gesamtauswertung</button>${me.role==='admin'?'<button class="s" id="sc2">Systemcheck</button>':''}</div><h2>Tests</h2><div class="box"><form id="ef" class="bar" style="margin:0">
 <label>Name des Tests<input id="et" required placeholder="z. B. 2000 m Test"></label>
 <label>Distanz (m)<input id="ed" type="number" value="2000" min="1" style="width:100px"></label><label>Disziplin<select id="edz"><option value="">–</option><option value="2k">2000 m Ergo</option><option value="6k">6000 m Ergo</option><option value="30min">30-Min-Test</option><option value="60min">1-Stunden-Test</option><option value="lang">Langstrecke Wasser</option><option value="klein">Kleinboot</option><option value="regatta">Regatta</option></select></label><label>Boot<select id="eb">${BOATS.map(b=>`<option>${b}</option>`).join('')}</select></label><button>Anlegen</button></form><div id="ev"></div></div>
 <h2>Fotos &amp; Einreichungen</h2><div class="box" id="ph"></div><div class="box" id="sv"></div>
 <details class="box"><summary><b>Referenzzeiten (Weltrekorde)</b></summary><div id="wr"></div></details>
 <h2>Teilnehmer</h2><div class="box">
 <label>Namen hier einfügen (ein Name pro Zeile, z. B. aus Excel kopiert)<textarea id="nl" rows="5" style="font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;box-sizing:border-box"></textarea></label>
 <div class="bar" style="margin-top:8px"><button id="nb">Liste übernehmen</button></div><p class="em" id="nmsg"></p><div id="sd"></div><div id="at"></div></div>
 ${['admin','trainer'].includes(me.role)?'<h2>Konten, Clubs und Rollen</h2><div class="box" id="pp"><p class="em">Lädt …</p></div>':''}`;bindOut();
 document.getElementById('ef').onsubmit=async e=>{e.preventDefault();
  const {data:nv,error}=await sb.from('events').insert({title:document.getElementById('et').value.trim(),distance_m:+document.getElementById('ed').value||2000,boat_class:document.getElementById('eb').value,discipline:document.getElementById('edz').value||null}).select('id').single();
  if(!error){const al=await sb.from('athletes').select('id');if(al.data&&al.data.length)await sb.from('event_athletes').insert(al.data.map(x=>({event_id:nv.id,athlete_id:x.id})))}
  if(error)alert(error.message);document.getElementById('et').value='';loadEv()};
 document.getElementById('stb').onclick=statsView;document.getElementById('cb').onclick=calcView;document.getElementById('nb2').onclick=nomView;document.getElementById('lb2').onclick=listView;document.getElementById('rg2').onclick=()=>regView();document.getElementById('gs2').onclick=gesamtView;if(me.role==='admin')document.getElementById('sc2').onclick=sysView;photoUI(document.getElementById('ph'));loadEv();loadAth();loadWr();loadPeople();
}
const DZL={'2k':'2000 m Ergo','6k':'6000 m Ergo','30min':'30-Min-Test','60min':'1-Stunden-Test','lang':'Langstrecke Wasser','klein':'Kleinboot','regatta':'Regatta','':'Ohne Typ'};
let EVQ='',EVT='';
async function loadEv(){
 const el=document.getElementById('ev'),{data,error}=await sb.from('events').select('*').order('created_at',{ascending:false});
 if(error)return el.innerHTML=`<p class="err">${esc(error.message)}</p>`;
 el.innerHTML=`<div class="bar"><label>Suchen<input id="eq" value="${esc(EVQ)}" placeholder="Test"></label><label>Test-Typ<select id="et2"><option value="">Alle</option>${Object.entries(DZL).map(([k,v])=>`<option value="${k}"${EVT===k?' selected':''}>${v}</option>`).join('')}</select></label></div><div id="evb"></div>`;
 const draw=()=>{const L=data.filter(e=>(!EVQ||e.title.toLowerCase().includes(EVQ))&&(!EVT||(e.discipline||'')===EVT)),g={};
  L.forEach(e=>(g[DZL[e.discipline||'']]=g[DZL[e.discipline||'']]||[]).push(e));
  document.getElementById('evb').innerHTML=Object.keys(g).map(k=>`<details class="box" open><summary><b>📁 ${esc(k)}</b> (${g[k].length})</summary>${g[k].map(e=>`<div class="row" style="flex-wrap:wrap"><span>${esc(e.title)} <span class="em">${new Date(e.created_at).toLocaleDateString('de-AT')}</span></span><span style="display:flex;gap:6px;flex-wrap:wrap"><button class="s" data-t="published" data-e="${e.id}">${e.published?'Schiedsrichter: AN':'Schiedsrichter: AUS'}</button><button class="s" data-t="upload_open" data-e="${e.id}">${e.upload_open?'Upload: OFFEN':'Upload: GESPERRT'}</button><button class="s" onclick="eventView('${e.id}')">Öffnen</button></span></div>`).join('')}</details>`).join('')||'<p class="em">Keine Tests gefunden.</p>'};
 document.getElementById('eq').oninput=e=>{EVQ=e.target.value.trim().toLowerCase();draw()};
 document.getElementById('et2').onchange=e=>{EVT=e.target.value;draw()};
 el.onclick=async e=>{const b=e.target.closest('[data-t]');if(!b)return;const ev=data.find(x=>x.id===b.dataset.e),k=b.dataset.t,r=await sb.from('events').update({[k]:!ev[k]}).eq('id',ev.id).select('id');
  if(r.error||!(r.data||[]).length)return alert('NICHT gespeichert: '+(r.error?dbErr(r.error):'keine Berechtigung (nur ÖRV-Trainer oder Admin).'));loadEv()};
 draw();
}
async function loadPeople(){
 const el=document.getElementById('pp'),adm=me.role==='admin';
 const [r,c]=await Promise.all([sb.from('profiles').select('*').order('name'),sb.from('clubs').select('name').order('name')]);
 if(r.error)return el.innerHTML=`<p class="err">${esc(r.error.message)}</p>`;
 CLUBS=(c.data||[]).map(x=>x.name);
 const RL=[['rower','Ruderer/in'],['club_trainer','Club-Trainer'],['referee','Schiedsrichter'],['trainer','ÖRV-Trainer'],['admin','Admin']],mm=t=>document.getElementById('pm3').textContent=t||'';
 el.innerHTML=`<div class="bar"><label>Neuer Club<input id="ncl" placeholder="Club-Name"></label><button class="s" id="nca">Club anlegen</button></div><p class="err" id="pm3"></p>`+r.data.map(p=>`<div class="row"><span>${esc(p.name||'(ohne Namen)')}</span><span style="display:flex;gap:6px"><select data-c="${p.id}"><option value="">Kein Club</option>${CLUBS.map(x=>`<option${p.club===x?' selected':''}>${esc(x)}</option>`).join('')}</select><select data-r="${p.id}"${adm&&p.id!==me.id?'':' disabled'}>${RL.map(([v,l])=>`<option value="${v}"${p.role===v?' selected':''}>${l}</option>`).join('')}</select></span></div>`).join('');
 document.getElementById('nca').onclick=async()=>{const n=document.getElementById('ncl').value.trim();if(!n)return mm('Bitte einen Namen eingeben.');const q=await sb.from('clubs').insert({name:n});if(q.error)return mm(q.error.message);loadPeople()};
 el.onchange=async e=>{const t=e.target,k=t.dataset.c?{club:t.value||null}:t.dataset.r?{role:t.value}:null;if(!k)return;const q=await sb.from('profiles').update(k).eq('id',t.dataset.c||t.dataset.r);mm(q.error?q.error.message:'✓ Gespeichert')};
}
let poll=null,off=0,wl=null;
const T=t=>Date.parse(t);
const sp=(ms,d)=>d>0?f(ms/d*500):'–';
function repsOf(ms){const out=[];let c=null;for(const m of ms){const t=T(m.t);
 if(m.kind==='start'){c={s:t,laps:[],fin:null,pause:0,ps:null,gross:null};out.push(c)}
 else if(c&&c.fin==null){
  if(m.kind==='pause'){if(c.ps==null)c.ps=t}
  else if(m.kind==='resume'){if(c.ps!=null){c.pause+=t-c.ps;c.ps=null}}
  else if(m.kind==='lap')c.laps.push(t-c.s-c.pause-(c.ps!=null?t-c.ps:0));
  else{if(c.ps!=null){c.pause+=t-c.ps;c.ps=null}c.gross=t-c.s;c.fin=t-c.s-c.pause}}}return out}
function secsOf(p,ev){const m=p.laps.concat(p.fin!=null?[p.fin]:[]);return m.map((t,i)=>({t:t-(i?m[i-1]:0),len:i<p.laps.length?ev.section_m:ev.distance_m-ev.section_m*p.laps.length}))}
async function eventView(id){
 const [a,b,c]=await Promise.all([sb.from('events').select('*').eq('id',id).single(),sb.from('athletes').select('id,name,birth_year,gender,weight_class').order('name'),sb.from('event_athletes').select('athlete_id,boat_class').eq('event_id',id)]);
 if(a.error)return alert(a.error.message);
 if(['30min','60min'].includes(a.data.discipline))return distView(a.data,b.data||[],new Set((c.data||[]).map(x=>x.athlete_id)));
 let ev=a.data,AL=b.data||[],part=new Set((c.data||[]).map(x=>x.athlete_id)),bc=Object.fromEntries((c.data||[]).map(x=>[x.athlete_id,x.boat_class])),WRs=[],sortWr=false,marks=[],mode='all',clockOk=false;
 try{mode=localStorage.getItem('mode')||'all'}catch(e){}
 if(me.role==='referee'&&mode==='all')mode='start';
 app.innerHTML=header()+`<button class="s" id="bk">Zurück</button><h2>${esc(ev.title)} <span class="em" style="font-size:17px" id="cnt"></span></h2>
 <div class="bar"><label>Meine Aufgabe auf diesem Gerät<select id="md">${me.role==='referee'?'':'<option value="all">ÖRV-Trainer: alles</option>'}<option value="start">Nur Start</option><option value="lap">Nur Zwischenzeit</option><option value="fin">Nur Ziel</option><option value="pause">Nur Pause/Wende</option></select></label>
 <label class="adm">Distanz (m)<input id="dd" type="number" value="${ev.distance_m}" style="width:100px"></label>
 <label class="adm">Abschnitt (m)<input id="ss" type="number" value="${ev.section_m}" style="width:100px"></label>
 <button class="s adm" id="tp">Teilnehmer ändern</button><button class="s adm" id="pub1"></button><button class="s adm" id="pub2"></button><button id="all">Alle starten</button></div>
 <div class="adm"><div class="box" id="pl" style="display:none"><div class="bar"><label>Suchen<input id="sq" placeholder="Name"></label><button class="s" id="pa">Alle dabei</button><button class="s" id="pn">Niemand dabei</button></div><div id="pb"></div></div></div>
 <p class="err" id="msg"></p><div id="lst"></div>
 <h2>Ergebnisse</h2><div class="bar"><button class="s" id="so">Sortierung: Zeit</button></div><div class="box w"><table id="tb"></table></div>
 <div class="bar adm"><button id="ae">Auswertung dieses Tests</button><button id="cp" class="s">Tabelle kopieren</button><button id="xl" class="s">Excel (.xlsx)</button><button id="csv" class="s">CSV</button>${me.role==='admin'?'<button id="dl" class="s">Test löschen</button>':''}</div>`;
 bindOut();
 sb.from('world_records').select('*').then(r=>{WRs=r.data||[];draw()});
 const $=x=>document.getElementById(x),msg=(t,ok)=>{$('msg').textContent=t||'';$('msg').style.color=ok?'var(--acc)':''};
 const ps=()=>AL.filter(x=>part.has(x.id));
 const rp=r=>repsOf(marks.filter(m=>m.rider_id===r.id));
 const stamp=()=>new Date(Date.now()+off).toISOString();
 const sync=async()=>{const t0=performance.now(),d=Date.now();const r=await sb.rpc('server_now');if(r.error||!r.data)return;off=T(r.data)-(d+(performance.now()-t0)/2);clockOk=true};
 const last={},KL={start:'Start',lap:'Zwischenzeit',fin:'Ziel',pause:'Pause',resume:'Weiter'};
 const add=async rows=>{const nw=Date.now();rows=rows.filter(x=>!(last[x.rider_id]&&nw-last[x.rider_id]<1500));if(!rows.length){msg('Doppeltippen ignoriert.');return}rows.forEach(x=>last[x.rider_id]=nw);const t=stamp();
  marks=marks.concat(rows.map((r,i)=>({...r,t,id:'tmp'+Date.now()+i}))).sort((x,y)=>T(x.t)-T(y.t));draw();
  try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}
  const r=await sb.from('marks').insert(clockOk?rows.map(x=>({...x,t})):rows);
  if(r.error)msg('NICHT gespeichert: '+(/row-level security/.test(r.error.message)?'keine Berechtigung (Trainer, Admin oder Schiedsrichter nötig).':r.error.message)+' Bitte erneut versuchen.');else msg('✓ Gespeichert: '+rows.map(x=>{const a=AL.find(z=>z.id===x.rider_id);return (a?a.name:'?')+' ('+KL[x.kind]+')'}).join(', '),true);
  await load()};
 const drawPl=()=>{const q=$('sq').value.trim().toLowerCase();
  $('pb').innerHTML=AL.filter(x=>x.name.toLowerCase().includes(q)).map(x=>`<label class="row" style="flex-direction:row;color:var(--ink);font-size:17px"><span>${esc(x.name)}</span><input type="checkbox" data-p="${x.id}"${part.has(x.id)?' checked':''}></label>`).join('')||'<p class="em">Keine Treffer.</p>'};
 const draw=()=>{
  document.querySelectorAll('.adm').forEach(n=>n.classList.toggle('hide',mode!=='all'));
  $('all').classList.toggle('hide',mode!=='all'&&mode!=='start');$('md').value=mode;
